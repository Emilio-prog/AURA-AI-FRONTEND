/* ── BREATHING MODAL ── */
function BreathingModal({onClose}){
  const [phase,setPhase]=useState('inhala'); // inhala exhala pausa
  const [count,setCount]=useState(4);
  const [cycle,setCycle]=useState(0);
  const [sosSent,setSosSent]=useState(false);

  useEffect(()=>{
    const phases=[
      {name:'inhala',dur:4000,next:'mantén'},
      {name:'mantén',dur:4000,next:'exhala'},
      {name:'exhala',dur:6000,next:'pausa'},
      {name:'pausa',dur:2000,next:'inhala'},
    ];
    let elapsed=0,timer;
    let phaseIdx=0;
    function tick(){
      const p=phases[phaseIdx];
      setPhase(p.name);
      setCount(Math.round(p.dur/1000));
      const countdown=setInterval(()=>{
        elapsed+=1000;
        setCount(c=>c>0?c-1:0);
      },1000);
      timer=setTimeout(()=>{
        clearInterval(countdown);
        phaseIdx=(phaseIdx+1)%phases.length;
        if(phaseIdx===0)setCycle(c=>c+1);
        tick();
      },p.dur);
    }
    tick();
    return()=>{clearTimeout(timer)};
  },[]);

  const phaseLabel={'inhala':'Inhala...','mantén':'Mantén...','exhala':'Exhala...','pausa':'Pausa...'};
  const isExpand=phase==='inhala'||phase==='mantén';

  return(
    <div style={{position:'fixed',inset:0,background:'oklch(10% 0.08 280 / 0.75)',backdropFilter:'blur(16px)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:'white',borderRadius:32,padding:48,maxWidth:440,width:'90%',textAlign:'center',boxShadow:`0 24px 80px ${C.pu}30`,position:'relative'}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:13,fontWeight:600,color:C.pu,letterSpacing:'0.08em',marginBottom:8}}>EJERCICIO DE RESPIRACIÓN 4-4-6</div>
        <h2 style={{fontSize:24,fontWeight:700,color:C.text,marginBottom:8,letterSpacing:'-0.03em'}}>Respira conmigo</h2>
        <p style={{fontSize:14,color:C.muted,marginBottom:36}}>Ciclo {cycle+1} · Enfoca tu atención en la respiración</p>

        <div style={{position:'relative',width:180,height:180,margin:'0 auto 32px',display:'flex',alignItems:'center',justifyContent:'center'}}>
          {/* rings */}
          {[1,2,3].map(i=>(
            <div key={i} style={{position:'absolute',width:'100%',height:'100%',borderRadius:'50%',
              border:`1.5px solid ${C.pu}`,opacity:isExpand?0.15:0.06,
              transform:`scale(${0.6+i*0.15})`,transition:'all 1s ease'}}/>
          ))}
          <div style={{position:'absolute',width:'100%',height:'100%',borderRadius:'50%',
            background:`radial-gradient(circle, oklch(88% 0.12 280) 0%, ${C.pu} 100%)`,
            transform:isExpand?'scale(1)':'scale(0.65)',
            transition:`transform ${phase==='exhala'?6000:4000}ms ease-in-out`,
            opacity:0.9}}/>
          <div style={{position:'relative',zIndex:2,textAlign:'center'}}>
            <div style={{fontSize:32,fontWeight:300,color:'white',lineHeight:1}}>{count}</div>
            <div style={{fontSize:13,color:'rgba(255,255,255,0.85)',fontWeight:500,marginTop:4}}>{phaseLabel[phase]}</div>
          </div>
        </div>

        {!sosSent?(
          <button onClick={()=>setSosSent(true)} style={{display:'block',width:'100%',padding:'13px',background:C.peachL,color:C.peach,border:`1.5px solid ${C.peach}30`,borderRadius:14,fontFamily:'inherit',fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:12,transition:'all 0.2s'}}
            onMouseEnter={e=>e.currentTarget.style.background=C.peach+20} onMouseLeave={e=>e.currentTarget.style.background=C.peachL}>
            📤 Enviar mensaje SOS a contactos
          </button>
        ):(
          <div style={{background:C.mintL,borderRadius:14,padding:'13px',marginBottom:12,fontSize:14,color:C.mint,fontWeight:600}}>
            ✓ Mensaje enviado a Ana y Carlos
          </div>
        )}
        <button onClick={onClose} style={{display:'block',width:'100%',padding:'13px',background:C.bg,color:C.muted,border:`1px solid ${C.border}`,borderRadius:14,fontFamily:'inherit',fontSize:14,fontWeight:500,cursor:'pointer',transition:'all 0.2s'}}>
          Cerrar ejercicio
        </button>
      </div>
    </div>
  );
}

/* ── CHATBOT MODAL ── */
function ChatbotModal({onClose}){
  const [msgs,setMsgs]=useState([
    {from:'ai',text:'Hola Laura 🌸 Estoy aquí contigo. ¿Cómo te sientes en este momento?'}
  ]);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const bottomRef=useRef();

  const responses=['Entiendo lo que sientes. La ansiedad es difícil, pero estás dando el primer paso al hablarlo. ¿Quieres intentar un ejercicio de respiración juntos?',
    'Es completamente normal sentirse así. Muchas personas pasan por momentos similares. ¿Qué crees que desencadenó este episodio?',
    'Estoy aquí contigo. Recuerda que este sentimiento es temporal y pasará. ¿Has probado el ejercicio de grounding 5-4-3-2-1?',
    'Gracias por compartir eso conmigo. Tus emociones son válidas. ¿Qué necesitas ahora mismo para sentirte un poco mejor?'];

  const send=()=>{
    if(!input.trim())return;
    const userMsg={from:'user',text:input};
    setMsgs(m=>[...m,userMsg]);
    setInput('');
    setTyping(true);
    setTimeout(()=>{
      setTyping(false);
      setMsgs(m=>[...m,{from:'ai',text:responses[Math.floor(Math.random()*responses.length)]}]);
    },1500+Math.random()*1000);
  };

  useEffect(()=>{bottomRef.current?.scrollIntoView({block:'nearest'})},[msgs,typing]);

  return(
    <div style={{position:'fixed',inset:0,background:'oklch(10% 0.08 280 / 0.6)',backdropFilter:'blur(12px)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:'white',borderRadius:28,width:420,height:580,display:'flex',flexDirection:'column',boxShadow:`0 24px 80px ${C.pu}25`,overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'20px 24px',borderBottom:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:40,height:40,borderRadius:'50%',background:`linear-gradient(135deg,${C.pu},oklch(65% 0.18 310))`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🤖</div>
          <div>
            <div style={{fontWeight:700,color:C.text,fontSize:15}}>Aura · Asistente IA</div>
            <div style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:C.mint}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:C.mint,display:'inline-block'}}/>Disponible 24/7
            </div>
          </div>
          <button onClick={onClose} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer',fontSize:20,color:C.muted}}>×</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:20,display:'flex',flexDirection:'column',gap:12}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{display:'flex',justifyContent:m.from==='user'?'flex-end':'flex-start'}}>
              <div style={{maxWidth:'78%',padding:'12px 16px',borderRadius:m.from==='user'?'18px 18px 4px 18px':'18px 18px 18px 4px',
                background:m.from==='user'?C.pu:C.puL,color:m.from==='user'?'white':C.text,
                fontSize:14,lineHeight:1.6}}>
                {m.text}
              </div>
            </div>
          ))}
          {typing&&(
            <div style={{display:'flex',gap:5,padding:'12px 16px',background:C.puL,borderRadius:'18px 18px 18px 4px',width:60}}>
              {[0,1,2].map(i=><span key={i} style={{width:7,height:7,borderRadius:'50%',background:C.pu,display:'block',animation:`bounce 1.2s ease ${i*0.2}s infinite`}}/>)}
            </div>
          )}
          <div ref={bottomRef}/>
        </div>
        <div style={{padding:'12px 16px',borderTop:`1px solid ${C.border}`,display:'flex',gap:10}}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
            placeholder="Escribe cómo te sientes..." style={{flex:1,padding:'11px 16px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:14,fontFamily:'inherit',fontSize:14,color:C.text,outline:'none'}}/>
          <button onClick={send} style={{width:44,height:44,borderRadius:14,background:C.pu,border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── MINIGAME: BURBUJAS ── */
function BubbleGame(){
  const [bubbles,setBubbles]=useState(()=>Array.from({length:12},(_,i)=>({id:i,x:Math.random()*80+5,y:Math.random()*70+10,size:30+Math.random()*30,color:[C.puL,C.mintL,C.peachL,C.yellowL,C.blueL][i%5],popped:false})));
  const [score,setScore]=useState(0);
  const pop=id=>{setBubbles(b=>b.map(b=>b.id===id?{...b,popped:true}:b));setScore(s=>s+1);};
  useEffect(()=>{
    if(bubbles.every(b=>b.popped)){
      setTimeout(()=>{setBubbles(b=>b.map(b=>({...b,popped:false,x:Math.random()*80+5,y:Math.random()*70+10,size:30+Math.random()*30})));},600);
    }
  },[bubbles]);
  return(
    <div style={{position:'relative',width:'100%',height:220,background:`linear-gradient(135deg,${C.puL},${C.mintL})`,borderRadius:20,overflow:'hidden',cursor:'default',userSelect:'none'}}>
      <div style={{position:'absolute',top:12,right:12,fontSize:12,fontWeight:700,color:C.pu,background:'white',borderRadius:100,padding:'4px 12px'}}>✨ {score} burbujas</div>
      {bubbles.map(b=>!b.popped&&(
        <div key={b.id} onClick={()=>pop(b.id)} style={{position:'absolute',left:`${b.x}%`,top:`${b.y}%`,width:b.size,height:b.size,borderRadius:'50%',
          background:b.color,border:`2px solid ${C.pu}20`,cursor:'pointer',
          animation:`floatOrb ${3+Math.random()*3}s ease-in-out infinite ${Math.random()*2}s`,
          transition:'transform 0.1s',boxShadow:`0 2px 12px ${C.pu}15`}}
          onMouseEnter={e=>e.currentTarget.style.transform='scale(1.15)'}
          onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}/>
      ))}
      <div style={{position:'absolute',bottom:12,left:12,fontSize:12,color:C.pu,fontWeight:500,opacity:0.7}}>Toca las burbujas para explotar</div>
    </div>
  );
}

/* ── MINIGAME: COLORES ── */
function ColorGame(){
  const colors=[C.pu,C.mint,C.peach,C.yellow,C.blue,'oklch(65% 0.18 310)','oklch(72% 0.14 200)'];
  const [items,setItems]=useState(()=>[...colors].sort(()=>Math.random()-0.5).map((c,i)=>({id:i,color:c})));
  const [dragging,setDragging]=useState(null);
  const [sorted,setSorted]=useState(false);

  const checkSorted=arr=>{
    // check if hue is ascending - simplified for demo
    setSorted(Math.random()>0.4);
  };

  return(
    <div style={{background:`linear-gradient(135deg,${C.yellowL},${C.peachL})`,borderRadius:20,padding:20}}>
      <div style={{fontSize:13,fontWeight:600,color:'oklch(55% 0.12 50)',marginBottom:16}}>Ordena los colores por tono</div>
      <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
        {items.map((item,i)=>(
          <div key={item.id} draggable onDragStart={()=>setDragging(i)}
            onDragOver={e=>{e.preventDefault();}}
            onDrop={()=>{
              if(dragging===null||dragging===i)return;
              const arr=[...items];[arr[dragging],arr[i]]=[arr[i],arr[dragging]];
              setItems(arr);setDragging(null);checkSorted(arr);
            }}
            style={{width:40,height:60,borderRadius:10,background:item.color,cursor:'grab',boxShadow:`0 3px 12px ${item.color}40`,transition:'transform 0.15s'}}
            onMouseEnter={e=>e.currentTarget.style.transform='translateY(-4px)'}
            onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}/>
        ))}
      </div>
      {sorted&&<div style={{textAlign:'center',marginTop:12,fontSize:13,color:C.mint,fontWeight:600}}>✨ ¡Muy bien! Arrastra para reordenar</div>}
      {!sorted&&<div style={{textAlign:'center',marginTop:12,fontSize:12,color:'oklch(55% 0.12 50)',opacity:0.7}}>Arrastra para ordenarlos</div>}
    </div>
  );
}

        <h2 style={{fontSize:24,fontWeight:700,color:C.text,letterSpacing:'-0.03em'}}>🎮 Minijuegos Anti-Ansiedad</h2>
        <div style={{background:'white',borderRadius:20,padding:24,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>Explotar Burbujas</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Toca las burbujas para liberar tensión mental</div>
          <BubbleGame/>
        </div>
        <div style={{background:'white',borderRadius:20,padding:24,border:`1px solid ${C.border}`}}>
          <div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:4}}>Ordenación Cromática</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:16}}>Organiza los colores por tono · Arrastra para ordenar</div>
          <ColorGame/>
        </div>
        <PlaceholderSection icon="🏖️" title="Pintura con Arena" desc="Dibuja libremente con arena digital. Próximamente disponible."/>
      </div>
    );
    case 'sonidos': return(
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <h2 style={{fontSize:24,fontWeight:700,color:C.text,letterSpacing:'-0.03em'}}>🎧 Ambientes Sonoros</h2>
        <SoundPlayer/>
        <PlaceholderSection icon="🎵" title="Más ambientes próximamente" desc="Sonidos de bosque, café, tormenta y más. Plan Personal incluye todos los ambientes."/>
      </div>
    );
    case 'diario': return(
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <h2 style={{fontSize:24,fontWeight:700,color:C.text,letterSpacing:'-0.03em'}}>📓 Diario Emocional</h2>
        <button onClick={()=>openModal('diary')} style={{background:C.puL,border:`1px solid ${C.puM}`,borderRadius:20,padding:24,cursor:'pointer',fontFamily:'inherit',textAlign:'left',transition:'all 0.2s'}}
          onMouseEnter={e=>e.currentTarget.style.boxShadow=`0 8px 32px ${C.pu}15`} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>
          <div style={{fontSize:18,fontWeight:700,color:C.text,marginBottom:4}}>✏️ Entrada de hoy · Lun 21 abr</div>
          <div style={{fontSize:13,color:C.muted}}>Haz clic para escribir tu entrada del día</div>
        </button>
        {[['Dom 20 abr','Me sentí mucho mejor después de hacer el ejercicio de respiración...'],['Sáb 19 abr','Día difícil en el trabajo pero Aura me ayudó a ordenar mis pensamientos...']]
          .map(([d,t])=>(
            <div key={d} style={{background:'white',borderRadius:16,padding:20,border:`1px solid ${C.border}`}}>
              <div style={{fontSize:12,color:C.muted,marginBottom:6}}>{d}</div>
              <div style={{fontSize:14,color:C.text,lineHeight:1.65,fontStyle:'italic'}}>"{t}"</div>
            </div>
          ))}
      </div>
    );
    case 'moodtracker': return(
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <h2 style={{fontSize:24,fontWeight:700,color:C.text,letterSpacing:'-0.03em'}}>📊 Mood Tracker</h2>
        <MoodChart/>
      </div>
    );
    case 'contactos': return(
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <h2 style={{fontSize:24,fontWeight:700,color:C.text,letterSpacing:'-0.03em'}}>👥 Contactos de Confianza</h2>
        <TrustedContacts/>
      </div>
    );
    case 'configuracion': return(
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <h2 style={{fontSize:24,fontWeight:700,color:C.text,letterSpacing:'-0.03em'}}>⚙️ Configuración</h2>
        <PlaceholderSection icon="⚙️" title="Ajustes de la cuenta" desc="Notificaciones, privacidad, idioma y preferencias. Próximamente."/>
      </div>
    );
    default: return null;
  }
}

/* ── APP ── */
function App(){
  const [section,setSection]=useState(()=>localStorage.getItem('aura-section')||'inicio');
  const [modal,setModal]=useState(null);
  const [tweaksVisible,setTweaksVisible]=useState(false);

  useEffect(()=>{localStorage.setItem('aura-section',section);},[section]);
  useEffect(()=>{
    const handler=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaksVisible(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaksVisible(false);
    };
    window.addEventListener('message',handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',handler);
  },[]);

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      <Sidebar active={section} setActive={setSection}/>
      <main style={{flex:1,overflowY:'auto',padding:'32px 36px',background:C.bg}}>
        <div style={{maxWidth:900,margin:'0 auto'}} key={section}>
          <SectionView id={section} openModal={setModal}/>
        </div>
      </main>

      {modal==='breathing'&&<BreathingModal onClose={()=>setModal(null)}/>}
      {modal==='chatbot'&&<ChatbotModal onClose={()=>setModal(null)}/>}
      {modal==='diary'&&<DiaryModal onClose={()=>setModal(null)}/>}
      <TweaksPanel visible={tweaksVisible}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
