<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aura AI — Panel Interior</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Inter',sans-serif;background:#fff;color:#000;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#f0f0f0}::-webkit-scrollbar-thumb{background:#000}
.mono{font-family:'Space Mono',monospace}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px)}
.b1{width:520px;height:520px;background:rgba(100,230,210,0.35);top:-80px;left:25%}
.b2{width:640px;height:640px;background:rgba(200,170,255,0.35);bottom:-180px;right:-120px}
.b3{width:420px;height:420px;background:rgba(255,180,190,0.35);top:45%;left:-60px}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.bc{background:rgba(255,255,255,0.88);backdrop-filter:blur(20px);border:4px solid #000;box-shadow:8px 8px 0 0 #000;padding:22px}
.btn{border:3px solid #000;box-shadow:4px 4px 0 0 #000;padding:10px 20px;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;cursor:pointer;transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#000}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn-coral{background:#FB7185;color:#fff;border-color:#000}
.btn-morado{background:#A855F7;color:#fff}
.btn-turquesa{background:#2DD4BF;color:#000}
.btn-negro{background:#000;color:#fff;border-color:#000}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;color:#555;border-bottom:2px solid #000;transition:background .1s,color .1s}
.nav-item:hover{background:#f5f5f5;color:#000}
.nav-item.active{background:#A855F7;color:#fff}
.nav-item.sos-nav{border-right:6px solid #FB7185}
.lbl{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:#555}
.lbl-coral{color:#FB7185}.lbl-morado{color:#A855F7}.lbl-turquesa{color:#2DD4BF}
.chip{border:2px solid #000;padding:4px 10px;font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:0.06em;display:inline-flex;align-items:center;gap:5px}
.chip-coral{background:#FB7185;color:#fff}.chip-morado{background:#A855F7;color:#fff}.chip-turquesa{background:#2DD4BF;color:#000}.chip-negro{background:#000;color:#fff}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}70%{transform:translateY(-3px)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes breatheCircle{0%,100%{transform:scale(0.65);opacity:.7}50%{transform:scale(1);opacity:1}}
.marquee-track{animation:marquee 22s linear infinite;display:flex;gap:0;white-space:nowrap}
.icon{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;font-weight:400;font-style:normal;display:inline-flex;align-items:center}
input,textarea{font-family:'Inter',sans-serif}
</style>
</head>
<body>
<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ── CONSTANTS ── */
const T='#2DD4BF',M='#A855F7',CR='#FB7185',K='#000',W='#fff',DK='#0A0A0A';
const TL='rgba(45,212,191,0.12)',ML='rgba(168,85,247,0.10)',CL='rgba(251,113,133,0.11)';
const BORDE='4px solid #000', SOMBRA='8px 8px 0 0 #000', SOMBRA_SM='4px 4px 0 0 #000';

const NAV=[
  {id:'inicio',icon:'home',label:'INICIO_'},
  {id:'sos',icon:'emergency',label:'BOTÓN_SOS',sos:true},
  {id:'chatbot',icon:'smart_toy',label:'CHATBOT_IA'},
  {id:'mood',icon:'mood',label:'MOOD_TRACKER'},
  {id:'juegos',icon:'sports_esports',label:'MINIJUEGOS'},
  {id:'sonidos',icon:'headphones',label:'AMBIENTES_SONOROS'},
  {id:'diario',icon:'book_2',label:'DIARIO'},
  {id:'contactos',icon:'group',label:'CONTACTOS_CONFIANZA'},
  {id:'config',icon:'settings',label:'CONFIGURACIÓN'},
];

/* ── SIDEBAR ── */
function Sidebar({active,set}){
  return(
    <aside style={{width:240,height:'100vh',background:W,borderRight:BORDE,display:'flex',flexDirection:'column',flexShrink:0,position:'relative',zIndex:20}}>
      <div style={{padding:'20px 18px',borderBottom:BORDE,display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:36,height:36,borderRadius:'50%',background:'radial-gradient(circle at 35% 35%, #c084fc 0%, #2DD4BF 100%)',border:'4px solid #000',flexShrink:0}}/>
        <div>
          <div style={{fontWeight:900,fontSize:16,letterSpacing:'-0.02em',lineHeight:1}}>AURA <span style={{color:M}}>AI</span></div>
          <div className="lbl" style={{fontSize:8,marginTop:2}}>PANEL_INTERIOR_V2</div>
        </div>
      </div>
      <nav style={{flex:1,overflowY:'auto'}}>
        {NAV.map(({id,icon,label,sos})=>(
          <button key={id} onClick={()=>set(id)}
            className={`nav-item${active===id?' active':''}${sos?' sos-nav':''}`}
            style={active===id?{background:M,color:W}:{}}
          >
            <span className="icon" style={{fontSize:18,color:active===id?W:sos?CR:'inherit'}}>{icon}</span>
            <span style={{flex:1}}>{label}</span>
            {sos&&<span style={{width:8,height:8,borderRadius:'50%',background:CR,animation:'pulse 2s ease infinite',flexShrink:0}}/>}
          </button>
        ))}
      </nav>
      <div style={{borderTop:BORDE,padding:'16px 14px',display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
        <div style={{width:36,height:36,border:BORDE,background:ML,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flexShrink:0}}>👩</div>
        <div>
          <div style={{fontSize:12,fontWeight:700}}>Laura García</div>
          <div className="lbl lbl-turquesa" style={{fontSize:9}}>PLAN_PERSONAL_ACTIVO</div>
        </div>
      </div>
    </aside>
  );
}

/* ── STATS MARQUEE ── */
function StatsBar(){
  const items=['SESIONES_HOY: 3','RACHA: DÍA_07_CONSECUTIVO','ANSIEDAD_PROMEDIO: 4.2/10','MOOD_HOY: BIEN','EJERCICIOS_RESPIRACIÓN: 12','BURBUJAS_EXPLOTADAS: 847','TIEMPO_APP: 23MIN'];
  const doubled=[...items,...items];
  return(
    <div style={{background:DK,color:W,height:38,overflow:'hidden',display:'flex',alignItems:'center',borderBottom:BORDE,flexShrink:0}}>
      <div className="marquee-track">
        {doubled.map((t,i)=>(
          <span key={i} className="mono" style={{fontSize:11,letterSpacing:'0.06em',padding:'0 32px',borderRight:'1px solid #333'}}>
            <span style={{color:T,marginRight:8}}>◆</span>{t}
          </span>
        ))}
      </div>
    </div>
  );
}

/* ── SOS BENTO CARD ── */
function SOSBentoCard({openBreathing}){
  return(
    <div className="bc c4" style={{background:CR,borderColor:K,display:'flex',flexDirection:'column',gap:14,position:'relative',overflow:'hidden'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div className="lbl" style={{color:'rgba(255,255,255,0.7)',fontSize:9}}>NIVEL_URGENCIA_ALTO</div>
        <span className="chip chip-negro" style={{fontSize:9}}>SIEMPRE_ACTIVO</span>
      </div>
      <div style={{fontSize:13,fontWeight:900,color:W,letterSpacing:'-0.02em',lineHeight:1.1}}>ACTIVAR_<br/>PROTOCOLO</div>
      <div style={{display:'flex',justifyContent:'center',alignItems:'center',flex:1,position:'relative'}}>
        <div style={{position:'absolute',width:90,height:90,borderRadius:'50%',border:'3px solid rgba(255,255,255,0.3)',animation:'ring 2s ease-out infinite'}}/>
        <div style={{position:'absolute',width:90,height:90,borderRadius:'50%',border:'3px solid rgba(255,255,255,0.2)',animation:'ring 2s ease-out infinite 0.7s'}}/>
        <button onClick={openBreathing} style={{width:80,height:80,borderRadius:'50%',background:W,border:'4px solid #000',boxShadow:SOMBRA,cursor:'pointer',fontSize:32,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',zIndex:1,transition:'transform .1s'}}
          onMouseEnter={e=>e.currentTarget.style.transform='scale(1.08)'}
          onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}
          aria-label="Activar SOS - Respiración guiada">
          🆘
        </button>
      </div>
      <button onClick={openBreathing} className="btn btn-negro" style={{width:'100%',justifyContent:'center',fontSize:11}}>
        RESPIRA_CONMIGO →
      </button>
    </div>
  );
}

/* ── HERO BENTO CARD ── */
function HeroBentoCard(){
  const [mood,setMood]=useState(null);
  const moods=[{e:'😰',l:'MUY_MAL',c:CR},{e:'😔',l:'MAL',c:'#fb923c'},{e:'😐',l:'REGULAR',c:'#facc15'},{e:'😊',l:'BIEN',c:T},{e:'🤩',l:'GENIAL',c:M}];
  const h=new Date().getHours();
  const greet=h<12?'BUENOS_DÍAS_':h<18?'BUENAS_TARDES_':'BUENAS_NOCHES_';
  return(
    <div className="bc c8" style={{display:'flex',flexDirection:'column',gap:16}}>
      <div>
        <div className="lbl" style={{marginBottom:6}}>{h<12?'BUENOS_DÍAS_':h<18?'BUENAS_TARDES_':'BUENAS_NOCHES_'} <span style={{color:M}}>LAURA</span></div>
        <div style={{fontSize:22,fontWeight:900,letterSpacing:'-0.03em',lineHeight:1.1}}>¿CÓMO_ESTÁS_HOY?</div>
        <div className="lbl" style={{marginTop:6}}>LUN, 27 ABR 2026 · <span style={{color:T}}>REGISTRA_TU_ESTADO_EMOCIONAL</span></div>
      </div>
      <div style={{display:'flex',gap:10}}>
        {moods.map(({e,l,c})=>(
          <button key={l} onClick={()=>setMood(l)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'12px 6px',border:`3px solid ${mood===l?c:K}`,background:mood===l?c+'22':W,cursor:'pointer',transition:'all .15s'}}>
            <span style={{fontSize:24}}>{e}</span>
            <span className="mono" style={{fontSize:9,color:mood===l?c:K,fontWeight:700}}>{l}</span>
          </button>
        ))}
      </div>
      {mood&&<div style={{border:'3px solid #000',background:TL,padding:'10px 14px',display:'flex',alignItems:'center',gap:10}}>
        <span className="mono" style={{fontSize:10,color:T,fontWeight:700}}>LOG_MOOD_REGISTRADO</span>
        <span className="mono" style={{fontSize:10,color:K}}>ESTADO: {mood} · 27/04/2026 · {new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}</span>
      </div>}
    </div>
  );
}

/* ── MOOD CHART CARD ── */
function MoodChartCard(){
  const [hov,setHov]=useState(null);
  const days=['L','M','X','J','V','S','D'];
  const before=[6,5,7,4,6,7,5];
  const after= [8,7,9,7,8,9,7];
  const W2=320,H2=100,pad=10,max=10;
  const toX=(i)=>pad+(i/(days.length-1))*(W2-pad*2);
  const toY=(v)=>H2-pad-(v/max)*(H2-pad*2);
  const pathBefore=before.map((v,i)=>`${i===0?'M':'L'}${toX(i)},${toY(v)}`).join(' ');
  const pathAfter=after.map((v,i)=>`${i===0?'M':'L'}${toX(i)},${toY(v)}`).join(' ');
  return(
    <div className="bc c8" style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <div style={{fontWeight:900,fontSize:14,letterSpacing:'-0.02em'}}>LOG_DIARIO_ESTADO_EMOCIONAL</div>
          <div className="lbl" style={{marginTop:3}}>ÚLTIMOS_7_DÍAS · ANTES/DESPUÉS_DE_AURA</div>
        </div>
        <div style={{display:'flex',gap:10}}>
          {[{c:'#ccc',l:'ANTES'},{c:M,l:'DESPUÉS'}].map(({c,l})=>(
            <div key={l} style={{display:'flex',alignItems:'center',gap:5}} className="lbl"><div style={{width:16,height:3,background:c,border:'1px solid #000'}}/>{l}</div>
          ))}
        </div>
      </div>
      <div style={{position:'relative'}}>
        <svg width="100%" viewBox={`0 0 ${W2} ${H2+20}`} style={{overflow:'visible'}}>
          {[2,4,6,8,10].map(v=>(
            <line key={v} x1={pad} y1={toY(v)} x2={W2-pad} y2={toY(v)} stroke="#e5e5e5" strokeWidth="1" strokeDasharray="3,3"/>
          ))}
          <path d={pathBefore} fill="none" stroke="#ccc" strokeWidth="2" strokeLinejoin="round"/>
          <path d={pathAfter} fill="none" stroke={M} strokeWidth="2.5" strokeLinejoin="round"/>
          {after.map((v,i)=>(
            <g key={i} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)} style={{cursor:'pointer'}}>
              <circle cx={toX(i)} cy={toY(v)} r={hov===i?7:5} fill={M} stroke={K} strokeWidth="2"/>
              {hov===i&&<g>
                <rect x={toX(i)-40} y={toY(v)-34} width="80" height="22" fill={K}/>
                <text x={toX(i)} y={toY(v)-18} textAnchor="middle" fill={W} fontSize="9" fontFamily="Space Mono">{`${before[i]}→${v} (+${v-before[i]})`}</text>
              </g>}
              <text x={toX(i)} y={H2+16} textAnchor="middle" fill="#555" fontSize="10" fontFamily="Space Mono">{days[i]}</text>
            </g>
          ))}
        </svg>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
        {[{l:'PROM_ANTES',v:'5.9',c:'#ccc'},{l:'PROM_DESPUÉS',v:'7.9',c:M},{l:'MEJORA_TOTAL',v:'+34%',c:T}].map(({l,v,c})=>(
          <div key={l} style={{border:`3px solid ${K}`,padding:'10px 12px',borderLeft:`6px solid ${c}`}}>
            <div className="lbl" style={{fontSize:8}}>{l}</div>
            <div style={{fontWeight:900,fontSize:20,letterSpacing:'-0.02em',marginTop:2}}>{v}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── SOUND PLAYER CARD ── */
function SoundPlayerCard(){
  const [playing,setPlaying]=useState(null);
  const [vol,setVol]=useState(70);
  const sounds=[{id:'lluvia',icon:'☁️',l:'LLUVIA_SUAVE'},{id:'oceano',icon:'🌊',l:'OCÉANO'},{id:'bosque',icon:'🌿',l:'BOSQUE'},{id:'blanco',icon:'〰️',l:'RUIDO_BLANCO'}];
  return(
    <div className="bc c4" style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{fontWeight:900,fontSize:13,letterSpacing:'-0.02em'}}>AMBIENTES_SONOROS</div>
      {playing&&<div style={{border:'3px solid '+T,padding:'6px 10px',background:TL,display:'flex',alignItems:'center',gap:6}}>
        <span style={{width:7,height:7,borderRadius:'50%',background:T,animation:'pulse 1.5s ease infinite'}}/>
        <span className="lbl lbl-turquesa" style={{fontSize:9}}>REPRODUCIENDO_AHORA</span>
      </div>}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {sounds.map(({id,icon,l})=>(
          <button key={id} onClick={()=>setPlaying(p=>p===id?null:id)}
            style={{border:`3px solid ${playing===id?T:K}`,padding:'10px 8px',background:playing===id?TL:W,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4,transition:'all .1s'}}>
            <span style={{fontSize:18}}>{icon}</span>
            <span className="mono" style={{fontSize:8,color:playing===id?T:K,fontWeight:700}}>{l}</span>
          </button>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <span className="icon" style={{fontSize:14}}>volume_mute</span>
        <div style={{flex:1,height:5,background:'#e5e5e5',border:'2px solid #000',cursor:'pointer',position:'relative'}}
          onClick={e=>{const r=e.currentTarget.getBoundingClientRect();setVol(Math.round((e.clientX-r.left)/r.width*100));}}>
          <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${vol}%`,background:M}}/>
          <div style={{position:'absolute',top:'50%',left:`${vol}%`,transform:'translate(-50%,-50%)',width:12,height:12,background:W,border:'2px solid #000'}}/>
        </div>
        <span className="mono" style={{fontSize:10,fontWeight:700,minWidth:28}}>{vol}%</span>
      </div>
    </div>
  );
}

/* ── QUICK ACCESS ROW ── */
function QuickAccess({setSection,openBreathing}){
  const items=[
    {icon:'smart_toy',l:'CHATBOT_IA',sec:'chatbot',c:M,bg:ML},
    {icon:'sports_esports',l:'MINIJUEGOS',sec:'juegos',c:T,bg:TL},
    {icon:'book_2',l:'DIARIO',sec:'diario',c:'#fb923c',bg:'rgba(251,146,60,0.1)'},
    {icon:'air',l:'RESPIRACIÓN_GUIADA',sec:null,action:openBreathing,c:CR,bg:CL},
  ];
  return(
    <div className="c12" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
      {items.map(({icon,l,sec,action,c,bg})=>(
        <button key={l} onClick={action||(()=>setSection(sec))}
          style={{border:BORDE,boxShadow:SOMBRA_SM,background:W,padding:'18px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:12,textAlign:'left',transition:'transform .1s,box-shadow .1s'}}
          onMouseEnter={e=>{e.currentTarget.style.background=bg;e.currentTarget.style.transform='translate(-2px,-2px)';e.currentTarget.style.boxShadow='10px 10px 0 0 #000'}}
          onMouseLeave={e=>{e.currentTarget.style.background=W;e.currentTarget.style.transform='';e.currentTarget.style.boxShadow=SOMBRA_SM}}>
          <div style={{width:40,height:40,background:bg,border:`3px solid ${c}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <span className="icon" style={{color:c,fontSize:20}}>{icon}</span>
          </div>
          <span className="mono" style={{fontSize:10,fontWeight:700,letterSpacing:'0.04em',lineHeight:1.3}}>{l}</span>
        </button>
      ))}
    </div>
  );
}

/* ── STREAK CARD ── */
function StreakCard(){
  const days=[1,2,3,4,5,6,7];
  return(
    <div className="bc c6" style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontWeight:900,fontSize:14,letterSpacing:'-0.02em'}}>RACHA_CONSECUTIVA</div>
        <span className="chip chip-morado">DÍA_07_CONSECUTIVO</span>
      </div>
      <div style={{display:'flex',gap:6}}>
        {days.map(d=>(
          <div key={d} style={{flex:1,height:36,border:`3px solid ${K}`,background:d<=7?M:W,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span className="mono" style={{fontSize:9,color:d<=7?W:K,fontWeight:700}}>{d}</span>
          </div>
        ))}
      </div>
      <div className="lbl" style={{fontSize:9}}>DÍAS_SIN_CRISIS_DE_ANSIEDAD · <span style={{color:T}}>RÉCORD_PERSONAL: 12_DÍAS</span></div>
      <div style={{display:'flex',gap:8}}>
        {['🏅 INICIO','⚡ DÍA_3','🌟 DÍA_7'].map(b=>(
          <div key={b} style={{border:'2px solid #000',padding:'5px 8px',fontSize:9,fontFamily:'Space Mono',background:TL}}>{b}</div>
        ))}
      </div>
    </div>
  );
}

/* ── QUOTE CARD ── */
function QuoteCard(){
  return(

/* ── BUBBLE GAME ── */
function BubbleGame(){
  const [bubbles,setBubbles]=useState(()=>Array.from({length:14},(_,i)=>({id:i,x:Math.random()*82+4,y:Math.random()*72+8,size:24+Math.random()*28,color:[ML,TL,CL,'rgba(251,191,36,0.2)','rgba(96,165,250,0.15)'][i%5],popped:false})));
  const [score,setScore]=useState(0);
  const pop=id=>{setBubbles(b=>b.map(b=>b.id===id?{...b,popped:true}:b));setScore(s=>s+1);};
  useEffect(()=>{if(bubbles.every(b=>b.popped))setTimeout(()=>setBubbles(b=>b.map(b=>({...b,popped:false,x:Math.random()*82+4,y:Math.random()*72+8,size:24+Math.random()*28}))),600);},[bubbles]);
  return(
    <div style={{position:'relative',width:'100%',height:200,border:BORDE,overflow:'hidden',background:'#fafafa',cursor:'default',userSelect:'none'}}>
      <div style={{position:'absolute',top:10,right:10,border:'2px solid #000',padding:'3px 10px',background:W}} className="mono" style={{fontSize:10,fontWeight:700}}>{score} EXPLOTADAS</div>
      {bubbles.map(b=>!b.popped&&(
        <div key={b.id} onClick={()=>pop(b.id)} style={{position:'absolute',left:`${b.x}%`,top:`${b.y}%`,width:b.size,height:b.size,borderRadius:'50%',background:b.color,border:'2px solid #000',cursor:'pointer',animation:`float ${3+Math.random()*2}s ease-in-out infinite ${Math.random()*2}s`,transition:'transform .1s'}}
          onMouseEnter={e=>e.currentTarget.style.transform='scale(1.2)'}
          onMouseLeave={e=>e.currentTarget.style.transform='scale(1)'}/>
      ))}
    </div>
  );
}

/* ── BREATHING MODAL ── */
function BreathingModal({onClose}){
  const phases=[{name:'INHALA',dur:4},{name:'MANTÉN',dur:7},{name:'EXHALA',dur:8}];
  const [pi,setPi]=useState(0);
  const [count,setCount]=useState(phases[0].dur);
  const [cycle,setCycle]=useState(1);
  const ph=phases[pi];
  useEffect(()=>{
    setCount(ph.dur);
    const iv=setInterval(()=>setCount(c=>{if(c<=1){clearInterval(iv);const ni=(pi+1)%phases.length;setPi(ni);if(ni===0)setCycle(c=>c+1);return phases[ni].dur;}return c-1;}),1000);
    return()=>clearInterval(iv);
  },[pi]);
  const isExpand=pi===0||pi===1;
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',backdropFilter:'blur(16px)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div style={{background:W,border:'6px solid #000',boxShadow:'12px 12px 0 0 #000',padding:48,width:440,textAlign:'center'}} onClick={e=>e.stopPropagation()}>
        <div className="lbl lbl-coral" style={{marginBottom:8}}>PROTOCOLO_RESPIRACIÓN_4-7-8</div>
        <div style={{fontWeight:900,fontSize:22,letterSpacing:'-0.03em',marginBottom:6}}>RESPIRA_CONMIGO</div>
        <div className="lbl" style={{marginBottom:36}}>CICLO_{String(cycle).padStart(2,'0')} · REDUCCIÓN_CORTISOL: 11% EN 2 MIN</div>
        <div style={{position:'relative',width:180,height:180,margin:'0 auto 36px',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid #000',background:`radial-gradient(circle, #fda4af 0%, ${CR} 100%)`,transform:isExpand?'scale(1)':'scale(0.6)',transition:`transform ${pi===2?8:pi===1?7:4}s ease-in-out`,opacity:.9}}/>
          <div style={{position:'relative',zIndex:2,textAlign:'center'}}>
            <div style={{fontSize:40,fontWeight:900,color:W,lineHeight:1}}>{count}</div>
            <div className="mono" style={{fontSize:12,color:'rgba(255,255,255,0.9)',fontWeight:700,marginTop:4}}>{ph.name}</div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:24}}>
          {phases.map(({name,dur},i)=>(
            <div key={name} style={{border:`3px solid ${i===pi?CR:K}`,padding:'8px',background:i===pi?CL:W}}>
              <div className="mono" style={{fontSize:9,fontWeight:700,color:i===pi?CR:K}}>{name}</div>
              <div style={{fontSize:18,fontWeight:900,color:i===pi?CR:K}}>{dur}s</div>
            </div>
          ))}
        </div>
        <button onClick={onClose} className="btn btn-negro" style={{width:'100%',justifyContent:'center'}}>CERRAR_EJERCICIO</button>
      </div>
    </div>
  );
}

/* ── SECTION ROUTER ── */
function SectionView({id,setSection,openBreathing}){
  switch(id){
    case 'inicio':    return <DashboardView setSection={setSection} openBreathing={openBreathing}/>;
    case 'sos':       return <SOSView openBreathing={openBreathing}/>;
    case 'chatbot':   return <ChatbotView/>;
    case 'mood':      return <MoodTrackerView/>;
    case 'juegos':    return <MinijuegosView/>;
    case 'sonidos':   return <SonidosView/>;
    case 'diario':    return <DiarioView/>;
    case 'contactos': return <ContactosView/>;

/* ── APP ── */
function App(){
  const [section,setSection]=useState(()=>localStorage.getItem('aura-section-v2')||'inicio');
  const [modal,setModal]=useState(null);
  const [tweaks,setTweaks]=useState(false);
  useEffect(()=>{localStorage.setItem('aura-section-v2',section);},[section]);
  useEffect(()=>{
    const h=e=>{
      if(e.data?.type==='__activate_edit_mode')setTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode')setTweaks(false);
    };
    window.addEventListener('message',h);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return()=>window.removeEventListener('message',h);
  },[]);
  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',position:'relative',zIndex:1}}>
      <Sidebar active={section} set={(s)=>{setSection(s);}}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <StatsBar/>
        <main style={{flex:1,overflowY:'auto',padding:'28px 32px',background:'transparent'}}>
          <div style={{maxWidth:960,margin:'0 auto'}} key={section}>
            <SectionView id={section} setSection={setSection} openBreathing={()=>setModal('breathing')}/>
          </div>
        </main>
      </div>
      {modal==='breathing'&&<BreathingModal onClose={()=>setModal(null)}/>}
      <TweaksPanel visible={tweaks}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
