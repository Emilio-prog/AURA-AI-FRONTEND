name: CI Frontend

on:
  pull_request:
  push:
    branches:
      - develop
      - feature
      - feature-*
      - feature/**
      - release
      - release/**
      - hotfix
      - hotfix/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.aura-ia.es/api/v1
          VITE_DEFAULT_LOCALE: es
          VITE_DEV_MODE: "false"
