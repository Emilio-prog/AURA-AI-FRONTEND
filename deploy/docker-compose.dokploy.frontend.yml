services:
  aura-frontend:
    image: ghcr.io/emilio-prog/aura-ai-frontend:latest
    container_name: aura-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
